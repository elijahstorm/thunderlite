name: Unit Tests

# Temporarily disabled: CI test runs are paused. To resume, restore the
# push/pull_request triggers below and remove the workflow_dispatch stub.
# on:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main, develop]
on:
    workflow_dispatch:
    
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Run tests
        run: pnpm test:unit
