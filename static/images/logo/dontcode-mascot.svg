<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1366" viewBox="0 0 1366 1366">
<style>
@keyframes talk-insight-animation {
  0%   { transform: translateX(0); }
  10%  { transform: translateX(-50px); }
  20%  { transform: translateX(0); }
  30%  { transform: translateX(30px); }
  40%  { transform: translateX(0); }
  60%  { transform: translateX(-30px); }
  70%  { transform: translateX(0); }
  85%  { transform: translateX(50px); }
  100% { transform: translateX(0); }
}

@keyframes whisker-animation {
  0%   { transform: translateX(0); }
  10%  { transform: translateX(-15px); }
  20%  { transform: translateX(0); }
  30%  { transform: translateX(10px); }
  40%  { transform: translateX(0); }
  60%  { transform: translateX(-10px); }
  70%  { transform: translateX(0); }
  85%  { transform: translateX(15px); }
  100% { transform: translateX(0); }
}

@keyframes blink-animation {
  0%, 29%, 71%, 100% {
    opacity: 1;
  }
  30%, 70% {
    opacity: 0;
  }
}

@keyframes open-eyes-animation {
  0%, 29%, 71%, 100% {
    opacity: 0;
  }
  30%, 70% {
    opacity: 1;
  }
}

.talk-insight-face {
  animation: talk-insight-animation 6s ease-in-out infinite;
}

.blink {
  animation: talk-insight-animation 6s ease-in-out infinite, blink-animation 6s linear infinite;
}

.open-eyes {
  animation: talk-insight-animation 6s ease-in-out infinite, open-eyes-animation 6s linear infinite;
}

.whisker-shift {
  animation: whisker-animation 6s ease-in-out infinite;
}
</style>

