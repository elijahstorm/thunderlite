<!-- Closed/thinking eyes — gentle downward arcs (visible ~58% of cycle) -->
<g class="blink">
  <path d="M202,692 Q342,742 482,692" fill="none" stroke="#221714" stroke-width="55" stroke-linecap="round"/>
  <path d="M659,692 Q799,742 939,692" fill="none" stroke="#221714" stroke-width="55" stroke-linecap="round"/>
</g>

